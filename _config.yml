# Production settings. Local preview overrides are in _config.dev.yml.
locale: en-US
title: Changxu Liu
title_separator: "-"
name: Changxu Liu
description: "Ph.D. candidate at Fudan University. Efficient LLM inference and hardware–software co-design."
url: https://austinliu01.github.io
baseurl: ""
repository: AustinLiu01/AustinLiu01.github.io
timezone: Asia/Shanghai
theme: null

author:
  name: "Changxu Liu (刘昶旭)"
  avatar: portrait-2026.jpg
  email: liucx22@m.fudan.edu.cn
  googlescholar: "https://scholar.google.com/citations?user=M0BekPkAAAAJ&hl=en"
  orcid: https://orcid.org/0009-0000-0132-1461
  github: AustinLiu01
  linkedin: changxu-liu-7b6463212

visitor_stats:
  enabled: true
  # Public widget ID from ClustrMaps; leave empty until a widget is created.
  clustrmaps_id: ""

include:
  - _pages
exclude:
  - .asset-cache
  - .bundle
  - .local
  - .jekyll-assets-cache
  - .sass-cache
  - bin
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - images/profile-icons/README.md
  - vendor
  - node_modules
  - tmp

encoding: utf-8
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
future: true

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Publication metadata feeds the homepage; old detail URLs redirect to its entries.
collections:
  publications:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: publications
    values:
      layout: publication-redirect
      sitemap: false

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
